# Monitoring & Alerting stack. Runs alongside the staging/production
# containers started by docker-compose.yml. Scrapes the production app's
# /metrics endpoint and routes alerts to a webhook receiver.
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  alert-receiver:
    build: ./monitoring/receiver
    ports:
      - "5001:5000"
    restart: unless-stopped
