{% extends "base.html" %}
{% block title %}Log in — OPTCG Deck Builder{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<div class="alert alert-warn">{{ error }}</div>{% endif %}
<form method="post" class="form-stack">
  <label>Username<input type="text" name="username" value="{{ username }}" required></label>
  <label>Password<input type="password" name="password" required></label>
  <button type="submit" class="btn">Log in</button>
</form>
<p class="muted">No account? <a href="{{ url_for('main.register_page') }}">Register</a></p>
{% endblock %}
