<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <title>{% block title %}OPTCG Deck Builder{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">🏴‍☠️ OPTCG Deck Builder</a>
    <nav>
      <a href="{{ url_for('main.index') }}">Cards</a>
      <a href="{{ url_for('main.decks_page') }}">Decks</a>
      {% if session.username %}
        <a href="{{ url_for('main.collection_page') }}">My Collection</a>
        <span class="muted">{{ session.username }}</span>
        <form method="post" action="{{ url_for('main.logout') }}" style="display:inline">
          <button class="btn btn-small" type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('main.login_page') }}">Log in</a>
        <a href="{{ url_for('main.register_page') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    Fan-made card art (auto-generated) — not affiliated with Bandai / Shueisha / Toei Animation.
  </footer>
</body>
</html>
