{% extends "base.html" %}
{% block title %}Register — OPTCG Deck Builder{% endblock %}
{% block content %}
<h1>Create an account</h1>
{% if errors %}
<div class="alert alert-warn"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>
{% endif %}
<form method="post" class="form-stack">
  <label>Username<input type="text" name="username" value="{{ username }}" required></label>
  <label>Password (min 8 characters)<input type="password" name="password" required></label>
  <button type="submit" class="btn">Register</button>
</form>
<p class="muted">Already have an account? <a href="{{ url_for('main.login_page') }}">Log in</a></p>
{% endblock %}
